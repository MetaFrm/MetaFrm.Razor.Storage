name: build 10.0

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  DLL_ID: 0
  PUSH_NUGET: "N"
  UPLOAD_MODULE: "N"
  NET_VERSION: "10.0" # NET¹öÀü
  COMPLETED_MESSAGE: ""

jobs:
  build10:
    runs-on: ubuntu-latest
    env:
      DLL_PATH: ""
      METAFRM_UPLOADMODULE_URL: ""
      METAFRM_UPLOADMODULE_ZIP: ""
      METAFRM_UPLOADMODULE_FILE: "temp/MetaFrameworkManagementSystemUploadModule.dll"

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: read

    steps:
    - uses: actions/checkout@v6
  
    - name: Change DLL_ID 10.0
      shell: bash
      if: env.NET_VERSION == '10.0'
      run: echo "DLL_ID=${{secrets.DLL_ID_10}}" >> "$GITHUB_ENV"
  
    - name: Change DLL_ID 11.0
      shell: bash
      if: env.NET_VERSION == '11.0'
      run: echo "DLL_ID=${{secrets.DLL_ID_11}}" >> "$GITHUB_ENV"

    - name: Change DLL_PATH, METAFRM_UPLOADMODULE_URL, METAFRM_UPLOADMODULE_ZIP
      shell: bash
      run: |
        echo "DLL_PATH=${{vars.NAMESPACE}}(net${{env.NET_VERSION}})/bin/Release/net${{env.NET_VERSION}}/${{vars.NAMESPACE}}.dll" >> "$GITHUB_ENV"
        echo "METAFRM_UPLOADMODULE_URL=https://download.metafrm.net/github/MetaFrameworkManagementSystemUploadModule${{env.NET_VERSION}}.zip" >> "$GITHUB_ENV"
        echo "METAFRM_UPLOADMODULE_ZIP=temp/MetaFrameworkManagementSystemUploadModule${{env.NET_VERSION}}.zip" >> "$GITHUB_ENV"
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "${{ env.NET_VERSION }}.x"
      
    - name: mkdir temp
      run: mkdir -p temp
        
    - name: Download Upload Module, Unzip, Install MAUI Workload (Windows)
      if: runner.os == 'Windows'
      run: |
        powershell -Command "Invoke-WebRequest -Uri '${{ env.METAFRM_UPLOADMODULE_URL }}' -OutFile '${{ env.METAFRM_UPLOADMODULE_ZIP }}'"
        powershell -Command "Expand-Archive -Path '${{ env.METAFRM_UPLOADMODULE_ZIP }}' -DestinationPath 'temp' -Force"
        dotnet workload install maui --ignore-failed-sources

    - name: Download Upload Module, Unzip (Non-Windows)
      if: runner.os != 'Windows'
      run: |
        wget -q "${{ env.METAFRM_UPLOADMODULE_URL }}" -O "${{ env.METAFRM_UPLOADMODULE_ZIP }}"
        unzip -q "${{ env.METAFRM_UPLOADMODULE_ZIP }}" -d temp

    - name: Restore dependencies
      shell: pwsh
      run: |
        dotnet restore "${{vars.NAMESPACE}}(net${{env.NET_VERSION}})"
        if ($LASTEXITCODE -ne 0) {
          "COMPLETED_MESSAGE=Restore dependencies Fail !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Build Release
      shell: pwsh
      run: |
        dotnet build -c Release --no-restore -v minimal
        if ($LASTEXITCODE -ne 0) {
          "COMPLETED_MESSAGE=Build Release Fail !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }
      
    - name: Test Release
      shell: pwsh
      run: |
        dotnet test -c Release --no-build --verbosity normal
        if ($LASTEXITCODE -ne 0) {
          "COMPLETED_MESSAGE=Test Release Fail !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Pack nugets
      shell: pwsh
      if: env.PUSH_NUGET == 'Y'
      run: |
        dotnet pack "${{vars.NAMESPACE}}(net${{env.NET_VERSION}})"  -c Release --no-build --output .
        if ($LASTEXITCODE -ne 0) {
          "COMPLETED_MESSAGE=Pack nugets Fail !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }
      
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      if: ${{ env.PUSH_NUGET == 'Y' }}
      with:
        user: ${{secrets.NUGET_USER}} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address

    - name: Push to NuGet
      shell: pwsh
      if: ${{ env.PUSH_NUGET == 'Y' }}
      run: |
        dotnet nuget push "111.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if ($LASTEXITCODE -ne 0) {
          "COMPLETED_MESSAGE=Push to NuGet Fail !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Upload Module
      shell: pwsh
      if: ${{ env.UPLOAD_MODULE == 'Y' }}
      run: |
        dotnet "${{env.METAFRM_UPLOADMODULE_FILE}}" "${{secrets.METAFRM_UPLOADMODULE_ACCESSKEY}}" "${{github.actor}}^${{secrets.PASSWORD}}" "upload" $env:DLL_ID "$env:DLL_PATH" "${{vars.NAMESPACE}}"
        if ($LASTEXITCODE -ne 0) {
          "COMPLETED_MESSAGE=Upload Module Fail !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Completed message
      shell: pwsh
      if: ${{ ! failure()}}
      run: |
        "COMPLETED_MESSAGE=CI/CD Completed !!" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Completed
      shell: pwsh
      if: always()
      run: dotnet "${{env.METAFRM_UPLOADMODULE_FILE}}" "${{secrets.METAFRM_UPLOADMODULE_ACCESSKEY}}" "${{github.actor}}^${{secrets.PASSWORD}}" "notification" "$env:COMPLETED_MESSAGE" "$env:DLL_PATH" "${{vars.NAMESPACE}}"